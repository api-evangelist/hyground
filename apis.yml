aid: hyground
name: Hyground
description: >-
  Hyground GmbH (Hamburg, Germany) builds a sovereign, self-hosted AI SRE
  (Site Reliability Engineering) agent for European enterprises. The
  multi-agent platform deploys as a Kubernetes-native Helm chart inside the
  customer's own perimeter and correlates Kubernetes, observability
  (Prometheus, Loki, Elasticsearch), cloud (AWS/Azure/GCP), CI/CD, and
  ticketing data to produce evidence-backed root cause analysis, autonomous
  incident response, and scheduled operations work such as CVE blast-radius
  mapping, RBAC drift audits, cluster right-sizing, and cost triage. It runs
  read-only by default, is bring-your-own-model (Azure OpenAI, Anthropic
  Claude, Gemini, Bedrock, Ollama), and keeps all data in-cluster with no
  external egress, targeting GDPR, BaFin, DORA, and NIS2 compliance
  requirements. Backed by partech; raised a EUR 3M pre-seed round.
